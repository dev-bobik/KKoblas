<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Panel</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- ── Přihlašovací overlay ──────────────────── -->
  <div class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <div class="lock-logo">⚠</div>
      <p class="lock-title">RESTRICTED ACCESS</p>
      <p class="lock-sub">Nutriční control panel</p>
      <form id="lockForm">
        <input type="password" id="lockInput" class="lock-input" placeholder="HESLO" autocomplete="off" autofocus>
        <button type="submit" class="lock-btn">VSTOUPIT</button>
        <p class="lock-error" id="lockError" hidden>Nesprávné heslo.</p>
      </form>
    </div>
  </div>

  <!-- ── Hlavní konzole ────────────────────────── -->
  <div class="console" id="consolEl" hidden>

    <header class="console-header">
      <div class="console-header__left">
        <span class="console-brand">KK&nbsp;NUTRIČNÍ</span>
        <span class="console-sub">CONTROL PANEL&nbsp;v2.0</span>
      </div>
      <div class="console-header__right">
        <span class="sys-indicator"></span>
        <span class="sys-label">SYSTÉM ONLINE</span>
      </div>
    </header>

    <div class="deploy-bar" id="deployBar" hidden>
      <span id="deployMsg"></span>
    </div>

    <div class="scanlines" aria-hidden="true"></div>

    <main class="console-grid">

      <!-- ── START-UP ───────── -->
      <div class="station" id="station-startup">
        <div class="station-label">START-UP</div>
        <div class="station-duration">1 měsíc · 6 900 Kč</div>
        <div class="status-display">
          <span class="status-led" id="led-startup"></span>
          <span class="status-text" id="statusText-startup">VOLNÝ</span>
        </div>
        <div class="btn-mount">
          <div class="btn-ring">
            <button class="launch-btn" id="btn-startup">
              <span class="launch-btn__label" id="btnLabel-startup">UZAVŘÍT</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ── MENTORING ──────── -->
      <div class="station" id="station-mentoring">
        <div class="station-label">MENTORING</div>
        <div class="station-duration">4 měsíce · 15 900 Kč</div>
        <div class="status-display">
          <span class="status-led" id="led-mentoring"></span>
          <span class="status-text" id="statusText-mentoring">VOLNÝ</span>
        </div>
        <div class="btn-mount">
          <div class="btn-ring">
            <button class="launch-btn" id="btn-mentoring">
              <span class="launch-btn__label" id="btnLabel-mentoring">UZAVŘÍT</span>
            </button>
          </div>
        </div>
      </div>

      <!-- ── ULTIMATE ───────── -->
      <div class="station" id="station-ultimate">
        <div class="station-label">ULTIMATE</div>
        <div class="station-duration">6 měsíců · 23 900 Kč</div>
        <div class="status-display">
          <span class="status-led" id="led-ultimate"></span>
          <span class="status-text" id="statusText-ultimate">VOLNÝ</span>
        </div>
        <div class="btn-mount">
          <div class="btn-ring">
            <button class="launch-btn" id="btn-ultimate">
              <span class="launch-btn__label" id="btnLabel-ultimate">UZAVŘÍT</span>
            </button>
          </div>
        </div>
      </div>

    </main>

    <div class="master-controls">
      <button class="master-btn master-btn--close" id="masterClose">▼ UZAVŘÍT VŠE</button>
      <button class="master-btn master-btn--open"  id="masterOpen">▲ OTEVŘÍT VŠE</button>
    </div>

    <footer class="console-footer">
      <span>Změny jsou okamžitě živé pro všechny návštěvníky</span>
      <a href="sluzby.html" target="_blank" class="footer-link">Otevřít stránku →</a>
    </footer>

  </div>

  <script src="admin.js"></script>
</body>
</html>
